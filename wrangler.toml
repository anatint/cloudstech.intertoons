name = "cloudstech"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
account_id = "f763c87d28c5cb2a660e7206e5b5aceb"

[vars]
# Wix Headless OAuth app client ID (public). Get it from the Wix dashboard:
#   Settings → Headless Settings → OAuth Apps → (create/visit a Visitor app).
# Non-secret, so it lives here as a var; override per-env if needed.
WIX_CLIENT_ID = "df0c393b-5bc6-403c-bb55-f4c5cb734dd7"

# Wix site id — used by the forms API route (/api/forms/quote) for the
# `wix-site-id` header when writing leads/contacts. Non-secret.
WIX_SITE_ID = "71f4ac93-4176-4894-bff5-79a6d8f00a71"
# NOTE: WIX_API_KEY (admin key, secret) is NOT here — set it with:
#   npx wrangler secret put WIX_API_KEY
# NOTE: ADMIN_SESSION_SECRET (signs /admin session cookies, secret) is NOT here — set it with:
#   npx wrangler secret put ADMIN_SESSION_SECRET
# (generate a random value first, e.g. `openssl rand -base64 32`)
# NOTE: OPENROUTER_API_KEY (powers the admin AI Assistant via openrouter/free, secret) is NOT here — set it with:
#   npx wrangler secret put OPENROUTER_API_KEY

# Static assets — served by Cloudflare's Assets CDN before the worker runs.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Incremental/ISR cache store (OpenNext kvIncrementalCache).
[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "22cf1b9c67e24a78b067870d7f6376a3"

# Durable Object queue that regenerates stale ISR pages (OpenNext doQueue).
[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

# Self-reference so the revalidation queue can call back into the worker to
# re-render stale ISR pages (required by OpenNext doQueue).
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "cloudstech"
